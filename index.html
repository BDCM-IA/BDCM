<script>

/* =========================
   BDCM — CONFIGURATION
========================= */

const BDCM_CONFIG = {

    // Voix sélectionnée par défaut
    voiceName: "",

    // Langue de reconnaissance
    recognitionLanguage: "fr-FR",

    // Vitesse de parole
    speechRate: 0.95,

    // Hauteur de voix
    speechPitch: 1,

    // Volume
    speechVolume: 1,

    // Adresse de notre futur backend
    apiEndpoint: "/api/chat"

};


/* =========================
   ELEMENTS
========================= */

const core =
    document.getElementById("core");

const coreContainer =
    document.getElementById("coreContainer");

const coreAction =
    document.getElementById("coreAction");

const userText =
    document.getElementById("userText");

const bdcmText =
    document.getElementById("bdcmText");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const canvas =
    document.getElementById("visualizer");

const ctx =
    canvas.getContext("2d");


/* =========================
   VARIABLES
========================= */

let audioContext = null;
let analyser = null;
let microphone = null;
let audioData = null;

let recognition = null;
let isListening = false;

let availableVoices = [];

let conversationHistory = [];


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   AUDIO VISUALIZER
========================= */

async function startVisualizer() {

    try {

        if (!audioContext) {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            analyser =
                audioContext.createAnalyser();

            analyser.fftSize = 256;

            microphone =
                audioContext.createMediaStreamSource(
                    stream
                );

            microphone.connect(analyser);

            audioData =
                new Uint8Array(
                    analyser.frequencyBinCount
                );
        }

        if (
            audioContext.state === "suspended"
        ) {

            await audioContext.resume();
        }

        drawVisualizer();

    } catch (error) {

        console.log(
            "Visualiseur audio indisponible.",
            error
        );
    }
}


function drawVisualizer() {

    requestAnimationFrame(
        drawVisualizer
    );

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (!analyser) {
        return;
    }

    analyser.getByteFrequencyData(
        audioData
    );

    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;

    const radius = 190;

    const bars =
        audioData.length;

    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );

    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const value =
            audioData[i] / 255;

        const angle =
            (i / bars) *
            Math.PI *
            2;

        const innerRadius =
            radius;

        const outerRadius =
            radius +
            value * 120;

        const x1 =
            Math.cos(angle) *
            innerRadius;

        const y1 =
            Math.sin(angle) *
            innerRadius;

        const x2 =
            Math.cos(angle) *
            outerRadius;

        const y2 =
            Math.sin(angle) *
            outerRadius;

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            x2,
            y2
        );

        ctx.strokeStyle =
            `rgba(245, 217, 40, ${0.05 + value * 0.35})`;

        ctx.lineWidth = 1;

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        BDCM_CONFIG.recognitionLanguage;

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function () {

            isListening = true;

            coreContainer.classList.add(
                "listening"
            );

            statusText.textContent =
                "ÉCOUTE ACTIVE";

            statusDot.style.background =
                "#f5d928";

            statusDot.style.boxShadow =
                "0 0 12px #f5d928";

            coreAction.textContent =
                "JE VOUS ÉCOUTE";

            bdcmText.textContent =
                "Parlez...";
        };


    recognition.onresult =
        function (event) {

            const text =
                event.results[0][0]
                    .transcript
                    .trim();

            userText.textContent =
                "Vous : " + text;

            respondToUser(text);
        };


    recognition.onerror =
        function (event) {

            console.log(
                "Erreur reconnaissance :",
                event.error
            );

            stopListening();

            if (
                event.error ===
                "not-allowed"
            ) {

                bdcmText.textContent =
                    "L'accès au microphone est refusé.";

            } else if (
                event.error ===
                "no-speech"
            ) {

                bdcmText.textContent =
                    "Je n'ai rien entendu.";

            } else {

                bdcmText.textContent =
                    "Une erreur est survenue.";
            }
        };


    recognition.onend =
        function () {

            stopListening();
        };

} else {

    statusText.textContent =
        "VOIX NON DISPONIBLE";

    bdcmText.textContent =
        "La reconnaissance vocale n'est pas disponible dans ce navigateur.";
}


/* =========================
   START LISTENING
========================= */

function startListening() {

    if (!recognition) {
        return;
    }

    try {

        userText.textContent = "";

        recognition.start();

        startVisualizer();

    } catch (error) {

        console.log(
            "Impossible de démarrer la reconnaissance.",
            error
        );
    }
}


/* =========================
   STOP LISTENING
========================= */

function stopListening() {

    isListening = false;

    coreContainer.classList.remove(
        "listening"
    );

    statusText.textContent =
        "SYSTEM ONLINE";

    statusDot.style.background =
        "#555";

    statusDot.style.boxShadow =
        "0 0 5px #555";

    coreAction.textContent =
        "CLIQUER POUR PARLER";
}


/* =========================
   CLICK ON CORE
========================= */

core.addEventListener(
    "click",
    function () {

        if (isListening) {

            recognition.stop();

        } else {

            startListening();
        }

    }
);


/* =========================
   OPENAI / BACKEND
========================= */

async function respondToUser(text) {

    if (!text || !text.trim()) {
        return;
    }

    const cleanText =
        text.trim();

    bdcmText.textContent =
        "Réflexion...";

    statusText.textContent =
        "BDCM RÉFLÉCHIT";

    statusDot.style.background =
        "#f5d928";

    statusDot.style.boxShadow =
        "0 0 12px #f5d928";

    coreAction.textContent =
        "TRAITEMENT";


    /*
       On garde l'historique de conversation.
    */

    conversationHistory.push({
        role: "user",
        content: cleanText
    });


    try {

        const response =
            await fetch(
                BDCM_CONFIG.apiEndpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            cleanText,

                        history:
                            conversationHistory

                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Erreur serveur : " +
                response.status
            );
        }


        const data =
            await response.json();


        const answer =
            data.reply ||
            data.output ||
            "Je n'ai pas reçu de réponse.";


        conversationHistory.push({
            role: "assistant",
            content: answer
        });


        bdcmText.textContent =
            answer;


        speak(answer);


    } catch (error) {

        console.error(
            "Erreur BDCM :",
            error
        );

        bdcmText.textContent =
            "Impossible de contacter mon système d'intelligence.";

        statusText.textContent =
            "ERREUR CONNEXION";

        statusDot.style.background =
            "#555";

        statusDot.style.boxShadow =
            "0 0 5px #555";

        coreAction.textContent =
            "CONNEXION IMPOSSIBLE";
    }
}


/* =========================
   VOICES
========================= */

function loadVoices() {

    availableVoices =
        speechSynthesis.getVoices();

    console.log(
        "Voix disponibles :",
        availableVoices
    );

}


/*
   Chrome charge parfois les voix
   quelques instants après le chargement.
*/

speechSynthesis.onvoiceschanged =
    loadVoices;

loadVoices();


/* =========================
   CHOOSE VOICE
========================= */

function setBDCMVoice(voiceName) {

    BDCM_CONFIG.voiceName =
        voiceName;

}


/* =========================
   GET SELECTED VOICE
========================= */

function getSelectedVoice() {

    availableVoices =
        speechSynthesis.getVoices();

    if (
        !BDCM_CONFIG.voiceName
    ) {

        /*
           Si aucune voix n'est définie,
           on cherche une voix française.
        */

        return (
            availableVoices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith("fr")
            ) ||

            availableVoices[0] ||

            null
        );
    }


    return (
        availableVoices.find(
            voice =>
                voice.name ===
                BDCM_CONFIG.voiceName
        ) ||

        availableVoices[0] ||

        null
    );
}


/* =========================
   BDCM VOICE
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    speechSynthesis.cancel();


    const voice =
        getSelectedVoice();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if (voice) {

        utterance.voice =
            voice;

        utterance.lang =
            voice.lang;

    } else {

        utterance.lang =
            BDCM_CONFIG.recognitionLanguage;
    }


    utterance.rate =
        BDCM_CONFIG.speechRate;

    utterance.pitch =
        BDCM_CONFIG.speechPitch;

    utterance.volume =
        BDCM_CONFIG.speechVolume;


    utterance.onstart =
        function () {

            statusText.textContent =
                "BDCM PARLE";

            statusDot.style.background =
                "#f5d928";

            statusDot.style.boxShadow =
                "0 0 12px #f5d928";

            coreAction.textContent =
                "TRANSMISSION";
        };


    utterance.onend =
        function () {

            statusText.textContent =
                "SYSTEM ONLINE";

            statusDot.style.background =
                "#555";

            statusDot.style.boxShadow =
                "0 0 5px #555";

            coreAction.textContent =
                "CLIQUER POUR PARLER";
        };


    utterance.onerror =
        function (error) {

            console.log(
                "Erreur voix :",
                error
            );

            statusText.textContent =
                "SYSTEM ONLINE";

            coreAction.textContent =
                "CLIQUER POUR PARLER";
        };


    speechSynthesis.speak(
        utterance
    );
}


/* =========================
   TEST VOICE
========================= */

function testBDCMVoice() {

    speak(
        "Bonjour. Je suis BDCM, votre assistant personnel."
    );
}


/* =========================
   CHANGE SPEECH SPEED
========================= */

function setSpeechRate(rate) {

    BDCM_CONFIG.speechRate =
        Number(rate);
}


/* =========================
   CHANGE PITCH
========================= */

function setSpeechPitch(pitch) {

    BDCM_CONFIG.speechPitch =
        Number(pitch);
}


/* =========================
   RESET CONVERSATION
========================= */

function clearConversation() {

    conversationHistory = [];

    userText.textContent = "";

    bdcmText.textContent =
        "Mémoire de conversation réinitialisée.";

}


/* =========================
   INITIALISATION
========================= */

statusText.textContent =
    "SYSTEM ONLINE";

bdcmText.textContent =
    "Bonjour. Je suis BDCM.";

</script>
